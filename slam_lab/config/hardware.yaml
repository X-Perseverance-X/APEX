lidar:
  port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-port0
  baudrate: 115200
  expected_serial: EAE9ECF0C3E09ED5A0EA98F379314117
  min_range_m: 0.15
  max_range_m: 12.0
  min_quality: 1
  angle_sign: -1
  angle_offset_rad: 0.0
  angle_frame_verified: true

imu:
  port: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1:1.0-port0
  baudrate: 115200
  sample_rate_hz: 100
  magnetometer_fusion: false
  axis_frame_verified: true

mapping:
  resolution_m: 0.05
  process_every_n_scans: 3  # Keep raw LiDAR at native rate; map at ~2.5 Hz on Pi 4
  max_roll_deg: 5.0
  max_pitch_deg: 5.0
  scan_match_cell_m: 0.10
  scan_match_max_translation_m: 0.20
  scan_match_translation_step_m: 0.05
  scan_match_yaw_window_deg: 8.0
  scan_match_yaw_step_deg: 2.0
  scan_match_min_score: 0.25
  scan_match_min_motion_gain: 0.04
  scan_match_downsample: 8

timing:
  # LiDAR scans last ~134 ms; both endpoint IMU samples must be close in
  # host monotonic time before we assign a scan-level 3D attitude.
  max_scan_imu_skew_ms: 40.0

logging:
  # Keep acquisition alive, but stop writing the session before filling the Pi SD card.
  max_session_mb: 512
  min_free_mb: 512

network:
  bind: 0.0.0.0
  port: 8765

visualization:
  web_map_cells: 3000
  local_map_cells: 600
  local_scan_points: 180

queues:
  imu_samples: 2048
  lidar_scans: 16
  visualization_frames: 2
