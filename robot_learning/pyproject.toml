[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-meta1-learning"
version = "0.1.0"
description = "Isolated META-1 physics and reinforcement-learning workspace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "mujoco>=3.2,<4", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.4,<3", "tensorboard>=2.17,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pillow>=10,<14"]

[project.scripts]
apex-rl = "apex_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex_rl = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
